<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorias de mi Tierra - Visor 3D/AR/VR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #cargando {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #eee; display: flex; align-items: center;
            justify-content: center; z-index: 20;
        }
        #banner {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px;
            border-radius: 20px; font-size: 13px; z-index: 15; text-align: center;
            max-width: 85%; display: none;
        }
    </style>
</head>
<body>
    <div id="cargando">Cargando modelo 3D...</div>
    <div id="banner"></div>

    <a-scene
        vr-mode-ui="enabled: true"
        loading-screen="enabled: false"
        webxr="optionalFeatures: hit-test, local-floor, dom-overlay;"
        renderer="colorManagement: true; physicallyCorrectLights: true">

        <a-assets timeout="30000">
            <a-asset-item id="modelo-glb" src=""></a-asset-item>
        </a-assets>

        <!-- Fondo solo para el modo "vista normal / VR". Se oculta al entrar en AR -->
        <a-sky id="cielo" color="#1a1a2e"></a-sky>

        <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
        <a-light type="directional" position="1 3 2" intensity="0.6"></a-light>
        <a-entity light="type: hemisphere; color: #fff; groundColor: #444; intensity: 0.5"></a-entity>

        <!-- Retícula que detecta mesa/piso en AR y coloca el modelo al tocar -->
        <a-entity id="reticulo"
            ar-hit-test="target:#modelo-3d; type: footprint;"
            visible="false">
        </a-entity>

        <a-entity id="modelo-3d" gltf-model="#modelo-glb"
            position="0 1.2 -2" visible="true"
            animation__aparecer="property: scale; from: 0 0 0; to: 1 1 1; dur: 0; startEvents: mostrar-modelo">
        </a-entity>

        <a-entity id="rig" position="0 1.6 0">
            <a-entity camera look-controls wasd-controls>
                <a-entity cursor="fuse: false" position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
                    material="color: white; shader: flat"></a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modelo = urlParams.get('m') || '1-la-serpiente-del-nacimiento-optimized.glb';
        const urlAbsoluta = `https://todosobrevillapinzon.github.io/3D-MEMORIAS-DE-MI-TIERRA/${modelo}`;

        const asset = document.getElementById('modelo-glb');
        const entidad = document.getElementById('modelo-3d');
        const cargando = document.getElementById('cargando');
        const banner = document.getElementById('banner');
        const escena = document.querySelector('a-scene');
        const cielo = document.getElementById('cielo');

        let factorEscalaBase = 1;

        asset.setAttribute('src', urlAbsoluta);

        entidad.addEventListener('model-loaded', () => {
            cargando.style.display = 'none';

            // Calcular escala/centro reales del modelo (tus 75 GLB no comparten escala)
            const mesh = entidad.getObject3D('mesh');
            if (mesh) {
                const box = new THREE.Box3().setFromObject(mesh);
                const size = new THREE.Vector3();
                box.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z) || 1;
                factorEscalaBase = 0.5 / maxDim; // ~50cm, tamaño razonable sobre una mesa
                entidad.setAttribute('scale', `${factorEscalaBase} ${factorEscalaBase} ${factorEscalaBase}`);

                const center = new THREE.Vector3();
                box.getCenter(center);
                entidad.object3D.position.x -= center.x * factorEscalaBase;
                entidad.object3D.position.z -= center.z * factorEscalaBase;
                // no restamos Y para que se apoye sobre su propia base
            }
        });

        entidad.addEventListener('model-error', (e) => {
            cargando.textContent = 'Error cargando el modelo: ' + modelo;
            console.error(e.detail);
        });

        // Al entrar/salir de una sesión inmersiva, ajustar fondo y comportamiento
        escena.addEventListener('enter-vr', () => {
            const enAR = escena.is('ar-mode');
            if (enAR) {
                cielo.setAttribute('visible', false); // deja pasar la cámara real
                entidad.setAttribute('visible', false); // se oculta hasta tocar sobre mesa/piso
                document.getElementById('reticulo').setAttribute('visible', true);
            }
        });
        escena.addEventListener('exit-vr', () => {
            cielo.setAttribute('visible', true);
            entidad.setAttribute('visible', true);
            entidad.setAttribute('position', '0 1.2 -2');
            entidad.setAttribute('scale', `${factorEscalaBase} ${factorEscalaBase} ${factorEscalaBase}`);
        });

        // Cuando el hit-test coloca el modelo, hacerlo visible
        document.getElementById('reticulo').addEventListener('ar-hit-test-select', () => {
            entidad.setAttribute('visible', true);
        });

        // Aviso según capacidades reales del navegador
        async function detectarYAvisar() {
            if (!navigator.xr) {
                banner.textContent = 'Tu navegador no soporta AR/VR. Puedes rotar el modelo arrastrando con el dedo.';
                banner.style.display = 'block';
                return;
            }
            const [ar, vr] = await Promise.all([
                navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
                navigator.xr.isSessionSupported('immersive-vr').catch(() => false)
            ]);
            if (ar) {
                banner.textContent = 'Toca "Entrar en AR", apunta a una mesa o al piso y toca la pantalla para colocarlo ahí.';
            } else if (vr) {
                banner.textContent = 'Toca "Entrar en VR" para verlo con tu visor.';
            } else {
                banner.textContent = 'Tu navegador no soporta AR/VR. Puedes rotar el modelo arrastrando con el dedo.';
            }
            banner.style.display = 'block';
            setTimeout(() => banner.style.display = 'none', 7000);
        }
        detectarYAvisar();
    </script>
</body>
</html>
