<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - Memorias de mi Tierra</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html { 
            margin: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: transparent !important; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: transparent !important;
        }
    </style>
</head>
<body style="background: transparent !important;">
    <model-viewer id="visor" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate skybox-image="" shadow-intensity="1" alt="Modelo 3D interactivo">
    </model-viewer>

    <script>
        // Lee el número o nombre del modelo que viene en el enlace (ejemplo: ?m=1-la-serpiente-del-nacimiento-optimized.glb)
        const urlParams = new URLSearchParams(window.location.search);
        let modelo = urlParams.get('m');
        
        if (modelo) {
            document.getElementById('visor').setAttribute('src', modelo);
        } else {
            // Modelo por defecto actualizado con el nombre correcto sin errores
            document.getElementById('visor').setAttribute('src', '1-la-serpiente-del-nacimiento-optimized.glb');
        }
    </script>
</body>
</html>
