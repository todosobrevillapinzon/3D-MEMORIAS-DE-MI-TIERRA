<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - Memorias 3D</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html { 
            margin: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: transparent; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: transparent; 
        }
    </style>
</head>
<body>
    <model-viewer id="visor" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate alt="Modelo 3D interactivo">
    </model-viewer>

    <script>
        // Este código lee automáticamente el modelo que se le pida por el enlace web
        const urlParams = new URLSearchParams(window.location.search);
        let modelo = urlParams.get('m');
        
        if (modelo) {
            document.getElementById('visor').setAttribute('src', modelo);
        } else {
            // Modelo por defecto si no se especifica ninguno
            document.getElementById('visor').setAttribute('src', '1. La Serpiente del Nacimiento.glb');
        }
    </script>
</body>
</html>
