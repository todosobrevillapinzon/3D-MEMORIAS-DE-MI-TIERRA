<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorias de mi Tierra</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #111; color: #fff; font-family: sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        model-viewer {
            width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;
        }
        .ui-box {
            z-index: 10; position: relative; max-width: 450px;
        }
        .btn {
            background: #28a745; color: white; padding: 16px 28px;
            border-radius: 12px; text-decoration: none; font-size: 18px;
            font-weight: bold; border: none; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: inline-block; margin-top: 15px;
        }
        .error-box { background: #220000; border: 1px solid #ff4444; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 13px; color: #ff8888; word-break: break-all; }
    </style>
</head>
<body>

    <div class="ui-box" id="ui">
        <h2>Memorias de mi Tierra</h2>
        <p id="msg">Cargando modelo 3D...</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let modelo = params.get('m');

        if (modelo) {
            // Decodificamos por si el QR trae caracteres especiales
            modelo = decodeURIComponent(modelo).trim().replace(/\.(glb|usdz)$/i, '');

            const modelUrl = `https://todosobrevillapinzon.github.io/3D-MEMORIAS-DE-MI-TIERRA/${modelo}.glb`;

            const viewer = document.createElement('model-viewer');
            viewer.setAttribute('src', modelUrl);
            viewer.setAttribute('ar', '');
            viewer.setAttribute('ar-modes', 'scene-viewer quick-look webxr');
            viewer.setAttribute('camera-controls', '');
            viewer.setAttribute('auto-rotate', '');

            const arBtn = document.createElement('button');
            arBtn.slot = 'ar-button';
            arBtn.className = 'btn';
            arBtn.textContent = 'Ver en Realidad Aumentada';
            viewer.appendChild(arBtn);

            document.body.appendChild(viewer);

            viewer.addEventListener('load', () => {
                document.getElementById('ui').style.display = 'none';
            });

            viewer.addEventListener('error', () => {
                document.getElementById('ui').innerHTML = `
                    <h2>Error de Carga</h2>
                    <p>El servidor no encontró el archivo exacto en GitHub.</p>
                    <div class="error-box">
                        <b>Enlace intentado:</b><br>${modelUrl}
                    </div>
                    <br>
                    <a href="${modelUrl}" class="btn" style="font-size:14px; padding:10px 20px;">Forzar descarga para probar</a>
                `;
            });

        } else {
            document.getElementById('msg').textContent = "Falta el parámetro ?m= en el código QR.";
        }
    </script>

</body>
</html>
