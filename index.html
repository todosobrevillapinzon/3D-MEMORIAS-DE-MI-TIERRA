<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D - Memorias de mi Tierra</title>
    <!-- Importar la librería model-viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100vh;
        }
        .error-message {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <div id="viewer-container"></div>

    <script>
        // Leer el parámetro ?m= del enlace (ej: ?m=la-serpiente.glb)
        const urlParams = new URLSearchParams(window.location.search);
        const modelName = urlParams.get('m');
        const container = document.getElementById('viewer-container');

        if (modelName) {
            // Usar ruta relativa limpia para que cargue directamente desde el repositorio
            const modelUrl = modelName;

            // Inyectar el model-viewer optimizado para carga web estable
            container.innerHTML = `
                <model-viewer 
                    src="${modelUrl}" 
                    alt="Modelo 3D de Memorias de mi Tierra" 
                    auto-rotate 
                    camera-controls 
                    loading="eager"
                    reveal="auto">
                </model-viewer>
            `;
        } else {
            // Mensaje por si entran a la página principal sin seleccionar ningún modelo
            container.innerHTML = `
                <div class="error-message">
                    <h2>Memorias de mi Tierra - Visor 3D</h2>
                    <p>Por favor, escanea un código QR del libro para visualizar el modelo correspondiente.</p>
                </div>
            `;
        }
    </script>

</body>
</html>
