<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorias de mi Tierra - AR</title>
    <!-- Importar la librería oficial de Google para manejo de modelos y AR -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        /* Estilo limpio para el visor que activa la cámara */
        model-viewer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="container" id="mensaje">
        <p>Abriendo la cámara...</p>
    </div>

    <script>
        // Leer el parámetro ?m= del QR (ej: ?m=la-serpiente.glb)
        const urlParams = new URLSearchParams(window.location.search);
        const modelo = urlParams.get('m');

        if (modelo) {
            // URL absoluta del archivo en tu repositorio de GitHub Pages
            const modelUrl = `https://todosobrevillapinzon.github.io/3D-MEMORIAS-DE-MI-TIERRA/${modelo}`;

            // Crear el elemento model-viewer dinámicamente optimizado solo para AR
            const viewer = document.createElement('model-viewer');
            viewer.setAttribute('src', modelUrl);
            viewer.setAttribute('ios-src', modelUrl); // Clave para que el iPhone abra la cámara nativa
            viewer.setAttribute('ar', '');
            viewer.setAttribute('ar-modes', 'quick-look webxr scene-viewer');
            viewer.setAttribute('camera-controls', '');
            
            document.body.appendChild(viewer);

            // Intentar abrir la cámara automáticamente apenas cargue
            viewer.addEventListener('load', () => {
                document.getElementById('mensaje').style.display = 'none';
                try {
                    viewer.activateAR();
                } catch (e) {
                    console.log("Activación manual requerida");
                }
            });

        } else {
            document.getElementById('mensaje').innerHTML = "<h3>Error: No se indicó ningún modelo en el enlace.</h3>";
        }
    </script>

</body>
</html>
