<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorias de mi Tierra</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .btn {
            background: #28a745;
            color: white;
            padding: 16px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        model-viewer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        .ui-box {
            z-index: 10;
            position: absolute;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="ui-box" id="ui">
        <h2>Memorias de mi Tierra</h2>
        <p id="msg">Cargando modelo 3D...</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let modelo = params.get('m');

        if (modelo) {
            if (!modelo.endsWith('.glb')) {
                modelo += '.glb';
            }

            // Ruta oficial y limpia de tu GitHub Pages
            const modelUrl = `https://todosobrevillapinzon.github.io/3D-MEMORIAS-DE-MI-TIERRA/${modelo}`;

            const viewer = document.createElement('model-viewer');
            viewer.setAttribute('src', modelUrl);
            viewer.setAttribute('ar', '');
            viewer.setAttribute('ar-modes', 'quick-look webxr scene-viewer');
            viewer.setAttribute('camera-controls', '');
            viewer.setAttribute('auto-rotate', '');

            const arBtn = document.createElement('button');
            arBtn.slot = 'ar-button';
            arBtn.className = 'btn';
            arBtn.textContent = 'Ver en Realidad Aumentada';
            viewer.appendChild(arBtn);

            document.body.appendChild(viewer);

            viewer.addEventListener('load', () => {
                document.getElementById('ui').style.display = 'none';
            });

            viewer.addEventListener('error', () => {
                document.getElementById('msg').textContent = "Error 404: Revisa que el archivo '" + modelo + "' exista en tu repositorio.";
            });

        } else {
            document.getElementById('msg').textContent = "Falta el parámetro ?m= en el código QR del libro.";
        }
    </script>

</body>
</html>
