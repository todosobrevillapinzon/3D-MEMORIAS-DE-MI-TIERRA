<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorias de mi Tierra - AR</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background: #28a745;
            color: white;
            padding: 18px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(40,167,69,0.4);
            margin-top: 20px;
            display: inline-block;
        }
        p { color: #aaa; max-width: 320px; font-size: 14px; }
    </style>
</head>
<body>

    <h2>Memorias de mi Tierra</h2>
    <p>Visualiza el elemento histórico en tu espacio real a través de la cámara.</p>

    <div id="contenedor-ar"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let modelo = urlParams.get('m');
        const contenedor = document.getElementById('contenedor-ar');

        if (modelo) {
            // Limpia cualquier extensión previa por seguridad
            modelo = modelo.replace(/\.(glb|usdz)$/i, '');

            // AQUí ESTÁ LA SOLUCIÓN DEFINITIVA:
            // Apuntamos directamente a la URL cruda y estable de tu archivo en GitHub de forma absoluta.
            // (Si tus archivos están dentro de una carpeta, agrégala aquí, ej: /modelos/ )
            const urlGlb = `https://raw.githubusercontent.com/todosobrevillapinzon/3D-MEMORIAS-DE-MI-TIERRA/main/${modelo}.glb`;

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

            if (isIOS) {
                // En iOS usamos la visualización directa del modelo
                contenedor.innerHTML = `<a href="${urlGlb}" class="btn">Ver Modelo 3D</a>`;
            } else {
                // En Android abrimos la cámara nativa mediante el visor de Google
                const urlSceneViewer = `https://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(urlGlb)}&mode=ar_only`;
                contenedor.innerHTML = `<a href="${urlSceneViewer}" class="btn">Abrir Cámara AR</a>`;
            }
        } else {
            contenedor.innerHTML = "<p style='color:#ff6b6b;'>Falta el parámetro del modelo en el código QR.</p>";
        }
    </script>

</body>
</html>
