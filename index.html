<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorias de mi Tierra - AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            padding: 20px;
            z-index: 10;
        }
        .btn-ar {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            margin-top: 20px;
            font-weight: bold;
        }
        .btn-ar:active {
            background-color: #005bb5;
        }
        model-viewer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="container" id="panel">
        <h2>Memorias de mi Tierra</h2>
        <p id="estado">Preparando visor 3D...</p>
        <button class="btn-ar" id="btnAr" style="display: none;">Ver en Realidad Aumentada</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modelo = urlParams.get('m');
        const panel = document.getElementById('panel');
        const estado = document.getElementById('estado');
        const btnAr = document.getElementById('btnAr');

        if (modelo) {
            const modelUrl = `https://todosobrevillapinzon.github.io/3D-MEMORIAS-DE-MI-TIERRA/${modelo}`;

            // Crear el model-viewer usando la ranura de interfaz nativa integrada
            const viewer = document.createElement('model-viewer');
            viewer.setAttribute('src', modelUrl);
            viewer.setAttribute('ios-src', modelUrl);
            viewer.setAttribute('ar', '');
            viewer.setAttribute('ar-modes', 'quick-look webxr scene-viewer');
            viewer.setAttribute('camera-controls', '');
            
            // Usar el botón AR nativo que incluye model-viewer para máxima compatibilidad con iOS y Android
            const arButtonSlot = document.createElement('button');
            arButtonSlot.setAttribute('slot', 'ar-button');
            arButtonSlot.className = 'btn-ar';
            arButtonSlot.textContent = 'Ver en Realidad Aumentada';
            viewer.appendChild(arButtonSlot);

            document.body.appendChild(viewer);

            viewer.addEventListener('load', () => {
                estado.style.display = 'none';
                panel.style.display = 'none'; // Oculta el panel HTML y deja visible el botón nativo del visor
            });

            viewer.addEventListener('error', () => {
                estado.textContent = "No se pudo cargar el archivo 3D. Verifica el enlace.";
            });

        } else {
            estado.textContent = "Error: Falta el parámetro del modelo en el QR.";
        }
    </script>

</body>
</html>
