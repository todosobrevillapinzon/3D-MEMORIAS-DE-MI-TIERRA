<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D - Memorias de mi Tierra</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e0e0e0;
            font-family: Arial, sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100vh;
        }
        .message-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <div id="viewer-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modelName = urlParams.get('m');
        const container = document.getElementById('viewer-container');

        if (modelName) {
            // Inyectar el visor y un detector de errores integrado
            container.innerHTML = `
                <model-viewer 
                    id="my-model"
                    src="${modelName}" 
                    alt="Modelo 3D" 
                    auto-rotate 
                    camera-controls 
                    loading="eager">
                </model-viewer>
            `;

            // Si el archivo falla en GitHub Pages, mostrará una alerta clara en lugar de pantalla blanca
            const modelViewer = document.getElementById('my-model');
            modelViewer.addEventListener('error', (event) => {
                container.innerHTML = `
                    <div class="message-box">
                        <h3 style="color: #d9534f;">No se pudo cargar el archivo</h3>
                        <p>El sistema no encuentra el archivo: <b>${modelName}</b></p>
                        <p style="font-size: 14px; color: #666;">Verifica que el nombre en el QR no tenga espacios, tildes o mayúsculas distintas a como lo subiste a GitHub.</p>
                    </div>
                `;
            });

        } else {
            container.innerHTML = `
                <div class="message-box">
                    <h2>Memorias de mi Tierra - Visor 3D</h2>
                    <p>Escanea un código QR del libro para ver el modelo.</p>
                </div>
            `;
        }
    </script>

</body>
</html>
